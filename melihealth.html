<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeliHealth HIS</title>
<style>
:root{
  --bg:#03111a; --card:rgba(9,32,46,.62); --tx:#dff7f6; --mut:#7fa3ab; --bd:rgba(63,232,216,.16);
  --ac:#35e8d8; --ac2:rgba(53,232,216,.11); --ac-tx:#021419; --vio:#8b7cff;
  --rojo:#ff8a98; --rojo2:rgba(255,95,115,.13); --verde:#5af0a8; --verde2:rgba(90,240,168,.12);
  --azul:#7cc4ff; --azul2:rgba(124,196,255,.13);
  --titulos:Bahnschrift,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --datos:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;color:var(--tx);font:15px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,124,255,.16),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(53,232,216,.12),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(63,232,216,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(63,232,216,.05) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
h1,h2,h3{margin:0 0 .6rem;font-family:var(--titulos);font-weight:600;line-height:1.2;letter-spacing:.01em;font-variation-settings:"wdth" 90}
h1{font-size:1.9rem;text-shadow:0 0 22px rgba(53,232,216,.35)}h2{font-size:1.2rem;color:#bff5ef}h3{font-size:1.02rem;color:#bff5ef}
h1::after{content:"";display:block;width:56px;height:3px;margin-top:.45rem;border-radius:2px;background:linear-gradient(90deg,var(--ac),var(--vio));box-shadow:0 0 12px var(--ac)}
a{color:var(--ac);text-underline-offset:3px}a:hover{color:#fff}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mut{color:var(--mut)}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:6px 22px 6px 22px;padding:1.15rem 1.3rem;margin-bottom:1.1rem;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.card::before{content:"";position:absolute;left:22px;right:40px;top:-1px;height:1px;background:linear-gradient(90deg,var(--ac),transparent);opacity:.7}
.pill{display:inline-block;margin-left:.6rem;padding:.12rem .75rem;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--ac);background:var(--ac2);border:1px solid var(--bd)}
.badge{display:inline-block;border-radius:5px;padding:.05rem .55rem;font-size:.8rem;font-weight:600;border:1px solid transparent}
.b-Agendada,.b-ver{background:var(--azul2);color:var(--azul);border-color:rgba(124,196,255,.3)}
.b-Atendida,.b-escribir{background:var(--verde2);color:var(--verde);border-color:rgba(90,240,168,.3)}
.b-Cancelada{background:var(--rojo2);color:var(--rojo);border-color:rgba(255,95,115,.3)}
button,.btn{font:inherit;cursor:pointer;color:var(--tx);background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:8px 14px 8px 14px;padding:.48rem 1rem;text-decoration:none;display:inline-block;transition:border-color .15s,box-shadow .15s,background .15s}
button:hover:not(:disabled){border-color:var(--ac);box-shadow:0 0 16px rgba(53,232,216,.25)}
button.pri{color:var(--ac-tx);font-weight:700;border-color:transparent;background:linear-gradient(120deg,var(--ac),#6fd6ff 55%,var(--vio));box-shadow:0 0 22px rgba(53,232,216,.28)}
button.pri:hover:not(:disabled){box-shadow:0 0 30px rgba(53,232,216,.55)}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;color:var(--tx);background:rgba(2,12,20,.65);border:1px solid var(--bd);border-radius:8px;padding:.5rem .7rem;max-width:100%;color-scheme:dark;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2),0 0 18px rgba(53,232,216,.2)}
select option{background:#06202e;color:var(--tx)}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:.25rem}
.fila{display:flex;gap:.8rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.8rem}
.tabla{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid rgba(63,232,216,.09);white-space:nowrap}
th{font-weight:600;font-size:.84rem;color:var(--mut);border-bottom-color:var(--bd)}
tbody tr:hover td,table tr:not(:first-child):hover td{background:rgba(53,232,216,.05)}
td:nth-child(2){font-variant-numeric:tabular-nums}
pre{margin:.8rem 0 0;padding:1rem;overflow:auto;max-height:60vh;border-radius:6px 16px 6px 16px;border:1px solid var(--bd);background:rgba(1,8,14,.8);color:#a8f5ee;font:13px/1.6 var(--datos)}
pre.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.9rem}
.dato b{display:block;font-size:.82rem;font-weight:500;color:var(--mut)}
.dato{font-size:1.02rem}
.aviso{border:1px solid rgba(255,95,115,.35);border-left:4px solid var(--rojo);background:var(--rojo2);color:var(--rojo);padding:.75rem 1rem;border-radius:6px 14px 6px 14px}
.nota{border:1px solid var(--bd);border-left:4px solid var(--ac);background:var(--ac2);padding:.75rem 1rem;border-radius:6px 14px 6px 14px;font-size:.9rem}

/* el pulso: una traza de monitor cardíaco, el único elemento animado */
.ecg{display:block;width:100%;height:100%}
.ecg path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ecg .base{stroke:rgba(53,232,216,.22);stroke-width:1.5}
.ecg .pulso{stroke:var(--ac);stroke-width:2.5;stroke-dasharray:16 84;filter:drop-shadow(0 0 5px var(--ac));animation:latido 3.4s linear infinite}
@keyframes latido{from{stroke-dashoffset:16}to{stroke-dashoffset:-84}}
@media(prefers-reduced-motion:reduce){.ecg .pulso{animation:none;stroke-dasharray:none;opacity:.8}*{transition:none!important}}

/* acceso */
#login{min-height:100vh;display:grid;place-items:center;padding:1rem}
#login .caja{width:100%;max-width:430px}
.traza-login{height:84px;margin:-.2rem 0 .6rem}
.titulo-login{font-family:var(--titulos);font-size:2.1rem;font-weight:600;font-variation-settings:"wdth" 88;letter-spacing:.01em;line-height:1.1;text-shadow:0 0 26px rgba(53,232,216,.45)}
.titulo-login span{color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.6rem}.chips button{font-size:.82rem;padding:.2rem .7rem;font-family:var(--datos)}

/* aplicación */
#app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{position:relative;overflow:hidden;grid-column:1/3;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 1.4rem;flex-wrap:wrap;
  background:rgba(4,20,30,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header .traza{position:absolute;inset:0;z-index:0;opacity:.55;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 8%,#000 40%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent 8%,#000 40%,#000 70%,transparent)}
header>*:not(.traza){position:relative;z-index:1}
.marca{display:flex;align-items:center;gap:.6rem;font-family:var(--titulos);font-size:1.35rem;font-weight:600;font-variation-settings:"wdth" 88}
.marca svg{width:30px;height:30px;filter:drop-shadow(0 0 8px var(--ac))}
.marca span{color:var(--ac)}
nav{padding:1.1rem .8rem;border-right:1px solid var(--bd);background:rgba(4,20,30,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
nav a{display:block;padding:.58rem .9rem;border-radius:6px 14px 6px 14px;color:var(--mut);text-decoration:none;margin-bottom:.2rem;transition:color .15s,background .15s}
nav a:hover{color:var(--tx);background:rgba(255,255,255,.04)}
nav a.act{color:var(--ac);font-weight:600;background:linear-gradient(90deg,rgba(53,232,216,.16),transparent);box-shadow:inset 3px 0 0 var(--ac);text-shadow:0 0 12px rgba(53,232,216,.5)}
main{padding:1.5rem;min-width:0;max-width:1120px}
footer{margin-top:2.2rem;font-size:.82rem;color:var(--mut)}
@media(max-width:760px){#app{grid-template-columns:1fr}header{grid-column:1}nav{display:flex;gap:.25rem;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:.5rem}nav a{white-space:nowrap;margin:0}h1{font-size:1.55rem}}

/* ===== Colores y movimiento extra ===== */
:root{--rosa:#ff7ad9;--ambar:#ffc857;--lima:#b8f36b;--naranja:#ff9f6b}
.orbes{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbes i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38;animation:flota 18s ease-in-out infinite alternate}
.orbes i:nth-child(1){width:380px;height:380px;background:var(--vio);top:-80px;right:8%}
.orbes i:nth-child(2){width:320px;height:320px;background:var(--ac);bottom:-60px;left:6%;animation-duration:23s}
.orbes i:nth-child(3){width:260px;height:260px;background:var(--rosa);top:42%;left:46%;animation-duration:27s;opacity:.2}
@keyframes flota{to{transform:translate(70px,-50px) scale(1.2)}}
h1{background:linear-gradient(90deg,#fff,var(--ac),var(--vio),var(--rosa),#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:brilla 8s linear infinite}
@keyframes brilla{to{background-position:-250% 0}}
nav a::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.6rem;background:var(--c,var(--ac));box-shadow:0 0 8px var(--c,var(--ac));transition:transform .2s}
nav a:hover::before{transform:scale(1.7)}
nav a.act{color:var(--c);box-shadow:inset 3px 0 0 var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),transparent);text-shadow:0 0 12px var(--c)}
nav a.act::before{animation:pulsa 1.4s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.8);opacity:.5}}
#vista>*{animation:entra .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}}
table tr{animation:fila .4s both}
@keyframes fila{from{opacity:0;transform:translateX(-10px)}}
#vista>*:nth-child(2){animation-delay:0.07s}#vista>*:nth-child(3){animation-delay:0.14s}#vista>*:nth-child(4){animation-delay:0.21s}#vista>*:nth-child(5){animation-delay:0.28s}#vista>*:nth-child(6){animation-delay:0.35s}#vista>*:nth-child(7){animation-delay:0.42s}table tr:nth-child(2){animation-delay:0.03s}table tr:nth-child(3){animation-delay:0.06s}table tr:nth-child(4){animation-delay:0.09s}table tr:nth-child(5){animation-delay:0.12s}table tr:nth-child(6){animation-delay:0.15s}table tr:nth-child(7){animation-delay:0.18s}table tr:nth-child(8){animation-delay:0.21s}table tr:nth-child(9){animation-delay:0.24s}table tr:nth-child(10){animation-delay:0.27s}table tr:nth-child(11){animation-delay:0.30s}table tr:nth-child(12){animation-delay:0.33s}table tr:nth-child(13){animation-delay:0.36s}table tr:nth-child(14){animation-delay:0.39s}table tr:nth-child(15){animation-delay:0.42s}table tr:nth-child(16){animation-delay:0.45s}
.grid>.card,.card.graf,.kpi{transition:transform .25s,box-shadow .25s,border-color .25s}
.grid>.card:hover,.card.graf:hover{transform:translateY(-3px);border-color:rgba(53,232,216,.4);box-shadow:0 14px 44px rgba(0,0,0,.4),0 0 26px rgba(53,232,216,.12)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem;margin-bottom:1.1rem}
.kpi{position:relative;overflow:hidden;padding:1rem 1.1rem;border-radius:6px 20px 6px 20px;background:var(--card);border:1px solid var(--bd)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
.kpi::after{content:"";position:absolute;width:110px;height:110px;right:-34px;bottom:-44px;border-radius:50%;background:var(--c);opacity:.14;filter:blur(8px)}
.kpi:hover{transform:translateY(-4px);box-shadow:0 12px 34px rgba(0,0,0,.4),0 0 24px color-mix(in srgb,var(--c) 30%,transparent)}
.kpi em{font-style:normal;font-size:1.5rem}
.kpi b{display:block;font:600 2.3rem/1.1 var(--titulos);color:var(--c);text-shadow:0 0 18px var(--c)}
.kpi span{color:var(--mut);font-size:.85rem}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1.1rem}
.barra{display:grid;grid-template-columns:96px 1fr 28px;gap:.6rem;align-items:center;margin:.5rem 0;font-size:.88rem}
.barra div{height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:6px;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.barra span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra b{text-align:right}
.donawrap{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.dona{position:relative;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;animation:dona 1.2s cubic-bezier(.2,.7,.2,1) both;box-shadow:0 0 28px rgba(139,124,255,.25)}
.dona::after{content:"";position:absolute;inset:24px;border-radius:50%;background:#0a2130}
.dona span{position:relative;z-index:1;font:600 1.3rem var(--titulos)}
@keyframes dona{from{transform:rotate(-160deg) scale(.5);opacity:0}}
.leyenda div{margin:.2rem 0;font-size:.9rem}.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.5rem}
.mods{display:flex;flex-wrap:wrap;gap:.5rem}
.alerta{display:flex;justify-content:space-between;gap:.6rem;padding:.5rem .7rem;margin:.4rem 0;border-radius:8px;background:var(--rojo2);border-left:3px solid var(--rojo);text-decoration:none;color:var(--tx);font-size:.88rem;transition:transform .2s}
.alerta:hover{transform:translateX(5px);color:var(--tx)}
.v{display:inline-block;min-width:2.2rem;text-align:center;padding:.05rem .5rem;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums}
.v-ok{background:var(--verde2);color:var(--verde)}
.v-warn{background:rgba(255,200,87,.14);color:var(--ambar)}
.v-bad{background:var(--rojo2);color:var(--rojo);animation:alarma 1.3s ease-in-out infinite}
@keyframes alarma{50%{box-shadow:0 0 14px var(--rojo)}}
.av{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:.5rem;border-radius:50%;font-size:.7rem;font-weight:700;color:#04121a;background:linear-gradient(135deg,hsl(var(--h) 90% 66%),hsl(calc(var(--h) + 50) 90% 62%));vertical-align:middle}
.av.grande{width:68px;height:68px;font-size:1.4rem;margin:0;box-shadow:0 0 24px hsl(var(--h) 90% 60%/.5);animation:late 2.6s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.06)}}
.fichahead{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}.fichahead h1{margin:0}
.sx{display:inline-block;width:1.7rem;text-align:center;border-radius:6px;font-weight:700}
.sx-F{background:rgba(255,122,217,.15);color:var(--rosa)}.sx-M{background:var(--azul2);color:var(--azul)}
.badge.m{background:hsl(var(--h) 80% 60%/.14);color:hsl(var(--h) 90% 74%);border-color:hsl(var(--h) 80% 60%/.3)}
tr.mal td{background:var(--rojo2);color:var(--rojo)}
.spark{display:flex;gap:1.4rem;flex-wrap:wrap;margin-top:1rem}
.spark svg{width:300px;height:64px;background:rgba(1,8,14,.5);border-radius:8px;border:1px solid var(--bd)}
.spark polyline{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:trazo 1.6s ease-out forwards;filter:drop-shadow(0 0 4px currentColor)}
@keyframes trazo{to{stroke-dashoffset:0}}
.toast{position:fixed;right:1.2rem;bottom:1.2rem;z-index:50;padding:.7rem 1.1rem;border-radius:8px 16px 8px 16px;color:var(--ac-tx);font-weight:700;background:linear-gradient(120deg,var(--verde),var(--ac));box-shadow:0 8px 30px rgba(53,232,216,.4);animation:toast 2.6s both}
@keyframes toast{0%{transform:translateY(30px);opacity:0}12%,85%{transform:none;opacity:1}100%{transform:translateY(10px);opacity:0}}
.reloj{font-family:var(--datos);font-size:.85rem;color:var(--ac);margin-left:auto;text-shadow:0 0 10px var(--ac)}
button.pri{background-size:200% 100%;animation:desliza 5s ease infinite}
@keyframes desliza{50%{background-position:100% 0}}
.chips button{border-color:hsl(var(--h,170) 80% 60%/.5);color:hsl(var(--h,170) 90% 76%);transition:transform .2s,box-shadow .2s}
.chips button:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){.orbes i,h1,button.pri,.v-bad,.av.grande,nav a.act::before,.dona,.spark polyline,#vista>*,table tr,.toast{animation:none!important}.spark polyline{stroke-dashoffset:0}.barra i{transition:none}}

/* ===== Tema clínico: blanco · fucsia · rosado (reemplaza el estilo oscuro) ===== */
:root{
  --bg:#fff8fb; --card:#ffffff; --tx:#2a1a23; --mut:#7a6670; --bd:#f3cfe0;
  --ac:#d6246e; --ac2:rgba(214,36,110,.09); --ac-tx:#ffffff; --vio:#7c5ce6; --ac-hover:#a8174f;
  --rojo:#d92d4b; --rojo2:rgba(217,45,75,.10); --verde:#1c8f68; --verde2:rgba(28,143,104,.12);
  --azul:#2f7fd6; --azul2:rgba(47,127,214,.12);
  --rosa:#ff5fa8; --ambar:#b7770a; --lima:#5b9f1f; --naranja:#d9692a;
}
html{color-scheme:light}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(255,95,168,.16),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(124,92,230,.10),transparent 60%),var(--bg)}
body::before{background-image:linear-gradient(rgba(214,36,110,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(214,36,110,.045) 1px,transparent 1px)}
h1{text-shadow:none;background:linear-gradient(90deg,var(--ac),var(--vio),var(--rosa),var(--ac));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
h1::after{box-shadow:none}
h2,h3{color:#8a1a4c}
a:hover{color:var(--ac-hover)}
::selection{background:#ffd3e6}
.card{box-shadow:0 8px 28px rgba(214,36,110,.08),inset 0 1px 0 #fff}
.kpi{background:#fff}
.kpi b{text-shadow:none}
.kpi::before{box-shadow:none}
.kpi:hover{box-shadow:0 12px 30px rgba(214,36,110,.14)}
.grid>.card:hover,.card.graf:hover{border-color:rgba(214,36,110,.4);box-shadow:0 12px 34px rgba(214,36,110,.14)}
button,.btn{background:#fff;color:var(--tx)}
button:hover:not(:disabled){box-shadow:0 0 0 3px var(--ac2)}
button.pri{color:#fff;box-shadow:0 6px 18px rgba(214,36,110,.28);background-image:linear-gradient(120deg,var(--ac),var(--rosa) 55%,var(--vio));background-size:200% 100%}
button.pri:hover:not(:disabled){box-shadow:0 8px 24px rgba(214,36,110,.42)}
input,select,textarea{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--bd);border-radius:8px;padding:.5rem .7rem;max-width:100%;color-scheme:light}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
select option{background:#fff;color:var(--tx)}
th,td{border-bottom-color:rgba(214,36,110,.10)}
th{background:#fff0f6}
tbody tr:hover td,table tr:not(:first-child):hover td{background:rgba(214,36,110,.05)}
pre{background:#fff0f6;color:#7a1243;border-color:var(--bd)}
.ecg .base{stroke:rgba(214,36,110,.22)}
.ecg .pulso{filter:none}
.titulo-login,.reloj{text-shadow:none}
.marca svg{filter:none}
header{background:rgba(255,255,255,.88)}
nav{background:rgba(255,255,255,.75)}
nav a:hover{background:rgba(214,36,110,.06)}
nav a.act{text-shadow:none;font-weight:700}
nav a::before{box-shadow:none}
.orbes i{opacity:.16}
.orbes i:nth-child(3){opacity:.10}
.dona{box-shadow:0 0 22px rgba(214,36,110,.15)}
.dona::after{background:#fff}
.spark svg{background:#fff0f6}
.spark polyline{filter:none}
.toast{color:#fff;background:linear-gradient(120deg,var(--ac),var(--vio));box-shadow:0 8px 26px rgba(214,36,110,.35)}
.chips button{color:hsl(var(--h,330) 65% 32%);border-color:hsl(var(--h,330) 70% 55%/.45);background:#fff}

<script>
/* MeliHealth HIS – lógica del lado del navegador (sin servidor, sin instalar nada).
   DEMO: la seguridad real (claves, permisos) solo puede garantizarla un backend. */
const HIS = (() => {
  // ---------- SHA-256 (para no guardar contraseñas en texto plano) ----------
  const primos = [];
  for (let n = 2; primos.length < 64; n++) if (primos.every(p => n % p)) primos.push(n);
  const frac = x => Math.floor((x - Math.floor(x)) * 4294967296);
  const K = primos.map(p => frac(Math.cbrt(p)));
  const H0 = primos.slice(0, 8).map(p => frac(Math.sqrt(p)));
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  function sha256(msg) {
    const b = new TextEncoder().encode(msg), l = b.length;
    const m = new Uint8Array(((l + 9 + 63) >> 6) << 6);
    m.set(b); m[l] = 0x80;
    const dv = new DataView(m.buffer);
    dv.setUint32(m.length - 4, (l * 8) >>> 0);
    dv.setUint32(m.length - 8, Math.floor(l * 8 / 4294967296));
    const h = H0.slice(), w = new Uint32Array(64);
    for (let o = 0; o < m.length; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b2, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25), ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22), mj = (a & b2) ^ (a & c) ^ (b2 & c);
        const t2 = (S0 + mj) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b2; b2 = a; a = (t1 + t2) >>> 0;
      }
      [a, b2, c, d, e, f, g, hh].forEach((v, i) => (h[i] = (h[i] + v) >>> 0));
    }
    return h.map(x => x.toString(16).padStart(8, '0')).join('');
  }

  // ---------- Almacenamiento (datos base + lo que se registra en el navegador) ----------
  const CLAVE = 'melihealth_extra_v1';
  const vacio = () => ({ pacientes: [], signos_vitales: [], auditoria: [], atenciones: [], diagnosticos: [], incidencias: [], inc_init: false });
  let extra = vacio();
  try { extra = Object.assign(vacio(), JSON.parse(localStorage.getItem(CLAVE) || '{}')); } catch (e) {}
  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(extra)); } catch (e) {} };
  const datos = () => ({
    ...DATOS,
    pacientes: [...DATOS.pacientes, ...extra.pacientes],
    signos_vitales: [...DATOS.signos_vitales, ...extra.signos_vitales],
    auditoria: [...DATOS.auditoria, ...extra.auditoria],
    atenciones: [...DATOS.atenciones, ...extra.atenciones],
    diagnosticos: [...DATOS.diagnosticos, ...extra.diagnosticos],
  });
  const restablecer = () => { extra = vacio(); try { localStorage.removeItem(CLAVE); } catch (e) {} };

  // ---------- Roles y permisos (misma matriz que backend/permisos.py) ----------
  const MATRIZ = {
    'Administrador': { usuarios: 'escribir', auditoria: 'ver', pacientes: 'ver', agenda: 'ver', fhir: 'ver', hl7: 'ver', incidencias: 'escribir' },
    'Admisionista': { pacientes: 'escribir', agenda: 'escribir' },
    'Médico': { pacientes: 'ver', agenda: 'ver', atenciones: 'escribir', diagnosticos: 'escribir', signos_vitales: 'escribir' },
    'Enfermero': { pacientes: 'ver', agenda: 'ver', atenciones: 'ver', diagnosticos: 'ver', signos_vitales: 'escribir' },
    'TENS': { pacientes: 'ver', agenda: 'ver', signos_vitales: 'escribir' },
    'Administrativo': { pacientes: 'ver', agenda: 'escribir' },
    'Interoperabilidad HL7-FHIR': { pacientes: 'ver', fhir: 'ver', hl7: 'ver', incidencias: 'ver' },
    'Matrona': { pacientes: 'ver', agenda: 'ver', atenciones: 'escribir', diagnosticos: 'escribir', signos_vitales: 'escribir' },
    'Kinesiólogo': { pacientes: 'ver', agenda: 'ver', atenciones: 'escribir', diagnosticos: 'ver', signos_vitales: 'ver' },
    'Nutricionista': { pacientes: 'ver', agenda: 'ver', atenciones: 'escribir', diagnosticos: 'ver', signos_vitales: 'ver' },
    'Psicólogo / Trab. Social': { pacientes: 'ver', agenda: 'ver', atenciones: 'escribir', diagnosticos: 'ver' },
    'Tec. Médico (Laboratorio)': { pacientes: 'ver', atenciones: 'ver' },
    'Imagenología': { pacientes: 'ver', atenciones: 'ver' },
    'Farmacia': { pacientes: 'ver', atenciones: 'ver', diagnosticos: 'ver' },
    'Gestión de camas': { pacientes: 'ver', atenciones: 'ver' },
    'Jefe de servicio': { pacientes: 'ver', agenda: 'ver', atenciones: 'ver', diagnosticos: 'ver', signos_vitales: 'ver', auditoria: 'ver', incidencias: 'ver' },
    'Calidad': { pacientes: 'ver', atenciones: 'ver', diagnosticos: 'ver', signos_vitales: 'ver', auditoria: 'ver', incidencias: 'ver' },
    'Soporte TI': { usuarios: 'ver', fhir: 'ver', hl7: 'ver', auditoria: 'ver', incidencias: 'escribir' },
    'Service Desk': { auditoria: 'ver', incidencias: 'escribir' },
    'Auditor': { auditoria: 'ver', incidencias: 'ver' },
  };
  const NIVEL = { ver: 1, escribir: 2 };
  const permitido = (rol, mod, acc = 'ver') => {
    const n = (MATRIZ[rol] || {})[mod];
    return !!n && NIVEL[n] >= NIVEL[acc];
  };

  // ---------- Sesión y auditoría ----------
  let sesion = null;
  try { sesion = JSON.parse(sessionStorage.getItem('melihealth_sesion') || 'null'); } catch (e) {}
  const ahora = () => {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  function auditar(usuario, accion, modulo) {
    extra.auditoria.push({ fecha_hora: ahora(), usuario, accion, modulo });
    guardar();
  }
  function login(usuario, password) {
    const u = DATOS.usuarios.find(x => x.usuario === usuario.trim());
    if (!u || u.hash !== sha256(u.usuario + ':' + password)) {
      auditar(usuario.trim() || '(vacío)', 'Inicio Sesión fallido', 'Login');
      return null;
    }
    sesion = { usuario: u.usuario, nombre: u.nombre, rol: u.rol };
    try { sessionStorage.setItem('melihealth_sesion', JSON.stringify(sesion)); } catch (e) {}
    auditar(u.usuario, 'Inicio Sesión', 'Login');
    return sesion;
  }
  function logout() {
    if (sesion) auditar(sesion.usuario, 'Cierre Sesión', 'Login');
    sesion = null;
    try { sessionStorage.removeItem('melihealth_sesion'); } catch (e) {}
  }

  // ---------- Registro de pacientes y signos vitales ----------
  function dvRut(n) {
    let s = 0, m = 2;
    for (const d of String(n).split('').reverse()) { s += +d * m; m = m === 7 ? 2 : m + 1; }
    const r = 11 - (s % 11);
    return r === 11 ? '0' : r === 10 ? 'K' : String(r);
  }
  function nuevoPaciente(p) {
    const id = Math.max(...datos().pacientes.map(x => x.id)) + 1;
    const reg = { id, rut: `${99000000 + id}-${dvRut(99000000 + id)}`, ...p };
    extra.pacientes.push(reg); guardar();
    return reg;
  }
  function nuevoSigno(s) {
    const id = Math.max(0, ...datos().signos_vitales.map(x => x.id)) + 1;
    const reg = { id, ...s };
    extra.signos_vitales.push(reg); guardar();
    return reg;
  }

  function nuevaAtencion(a) {
    const id = Math.max(0, ...datos().atenciones.map(x => x.id)) + 1;
    const reg = { id, ...a };
    extra.atenciones.push(reg); guardar();
    return reg;
  }
  function nuevoDiagnostico(dx) {
    const id = Math.max(0, ...datos().diagnosticos.map(x => x.id)) + 1;
    const reg = { id, ...dx };
    extra.diagnosticos.push(reg); guardar();
    return reg;
  }

  // ---------- FHIR R4 ----------
  const RUT_SYSTEM = 'https://melihealth.local/rut'; // reemplazar por el de CL Core (HL7 Chile)
  const LOINC = 'http://loinc.org', UCUM = 'http://unitsofmeasure.org';
  const qty = (v, unit, code) => ({ valueQuantity: { value: v, unit, system: UCUM, code } });
  const obs = (id, pid, fecha, loinc, nombre, extraProps) => ({
    resourceType: 'Observation', id, status: 'final',
    category: [{ coding: [{ system: 'http://terminology.hl7.org/CodeSystem/observation-category', code: 'vital-signs' }] }],
    code: { coding: [{ system: LOINC, code: loinc, display: nombre }] },
    subject: { reference: `Patient/${pid}` }, effectiveDateTime: fecha, ...extraProps,
  });
  const fhirPaciente = p => ({
    resourceType: 'Patient', id: String(p.id),
    identifier: [{ system: RUT_SYSTEM, value: p.rut }],
    name: [{ family: p.apellidos, given: [p.nombres] }],
    gender: { M: 'male', F: 'female' }[p.sexo] || 'unknown', birthDate: p.fecha_nacimiento,
    telecom: [
      ...(p.telefono ? [{ system: 'phone', use: 'home', value: p.telefono }] : []),
      ...(p.email ? [{ system: 'email', value: p.email }] : []),
    ],
    address: [{ city: p.ciudad, country: 'CL' }],
  });
  const fhirProfesional = x => ({
    resourceType: 'Practitioner', id: String(x.id),
    identifier: [{ system: RUT_SYSTEM, value: x.rut }], name: [{ text: x.nombre }],
    qualification: [{ code: { text: `${x.profesion} - ${x.especialidad}` } }],
  });
  function fhirSignos(s) {
    const out = [], pid = s.paciente_id, f = s.fecha, i = s.id;
    if (s.pa && s.pa.includes('/')) {
      const [sis, dia] = s.pa.split('/').map(Number);
      out.push(obs(`${i}-pa`, pid, f, '85354-9', 'Presión arterial', {
        component: [
          { code: { coding: [{ system: LOINC, code: '8480-6', display: 'Sistólica' }] }, ...qty(sis, 'mmHg', 'mm[Hg]') },
          { code: { coding: [{ system: LOINC, code: '8462-4', display: 'Diastólica' }] }, ...qty(dia, 'mmHg', 'mm[Hg]') },
        ],
      }));
    }
    out.push(
      obs(`${i}-fc`, pid, f, '8867-4', 'Frecuencia cardiaca', qty(s.fc, '/min', '/min')),
      obs(`${i}-fr`, pid, f, '9279-1', 'Frecuencia respiratoria', qty(s.fr, '/min', '/min')),
      obs(`${i}-temp`, pid, f, '8310-5', 'Temperatura corporal', qty(s.temp, '°C', 'Cel')),
      obs(`${i}-sat`, pid, f, '2708-6', 'Saturación de oxígeno', qty(s.sato2, '%', '%')));
    return out;
  }
  function fhirBundle(pid) {
    const d = datos(), p = d.pacientes.find(x => x.id === pid);
    const aten = d.atenciones.filter(a => a.paciente_id === pid);
    const ids = new Set(aten.map(a => a.id));
    const recursos = [fhirPaciente(p)];
    d.profesionales.filter(x => aten.some(a => a.profesional_id === x.id)).forEach(x => recursos.push(fhirProfesional(x)));
    aten.forEach(a => recursos.push({
      resourceType: 'Encounter', id: String(a.id), status: 'finished',
      class: { system: 'http://terminology.hl7.org/CodeSystem/v3-ActCode', code: 'AMB' },
      subject: { reference: `Patient/${pid}` },
      participant: [{ individual: { reference: `Practitioner/${a.profesional_id}` } }],
      period: { start: a.fecha }, reasonCode: [{ text: a.motivo }],
    }));
    d.diagnosticos.filter(x => ids.has(x.atencion_id)).forEach(x => recursos.push({
      resourceType: 'Condition', id: String(x.id),
      code: { coding: [{ system: 'http://hl7.org/fhir/sid/icd-10', code: x.cie10, display: x.descripcion }] },
      subject: { reference: `Patient/${pid}` }, encounter: { reference: `Encounter/${x.atencion_id}` },
    }));
    d.signos_vitales.filter(s => s.paciente_id === pid).forEach(s => recursos.push(...fhirSignos(s)));
    return { resourceType: 'Bundle', type: 'collection', entry: recursos.map(resource => ({ resource })) };
  }

  // ---------- HL7 v2.5 ----------
  const esc = s => String(s ?? '').replace(/\\/g, '\\E\\').replace(/\|/g, '\\F\\').replace(/\^/g, '\\S\\').replace(/&/g, '\\T\\').replace(/~/g, '\\R\\');
  const msh = (tipo, ev, ctrl) => {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const ts = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
    return `MSH|^~\\&|MELIHEALTH|MELIHEALTH-HIS|DESTINO|DESTINO|${ts}||${tipo}^${ev}|${ctrl}|P|2.5`;
  };
  const pid = p => ['PID', '1', '', `${esc(p.rut)}^^^RUN^NI`, '', `${esc(p.apellidos)}^${esc(p.nombres)}`, '',
    (p.fecha_nacimiento || '').replace(/-/g, ''), esc(p.sexo), '', '', `^^${esc(p.ciudad)}^^^CL`, '', esc(p.telefono)].join('|');
  function hl7(tipo, pacienteId) {
    const d = datos(), p = d.pacientes.find(x => x.id === pacienteId);
    if (tipo === 'ADT_A04' || tipo === 'ADT_A08') {
      const ev = tipo.split('_')[1];
      const a = d.atenciones.find(x => x.paciente_id === pacienteId);
      const pr = a && d.profesionales.find(x => x.id === a.profesional_id);
      return [msh('ADT', ev, `ADT${p.id}`), `EVN|${ev}`, pid(p),
        ['PV1', '1', 'O', '', '', '', '', pr ? `${esc(pr.rut)}^${esc(pr.nombre)}` : ''].join('|')].join('\n');
    }
    const seg = [msh('ORU', 'R01', `ORU${p.id}`), pid(p), 'OBR|1|||SV^Signos vitales^L'];
    let n = 0;
    const obx = (t, c, nom, v, u) => seg.push(`OBX|${++n}|${t}|${c}^${nom}^LN||${esc(v)}|${esc(u)}|||||F`);
    d.signos_vitales.filter(s => s.paciente_id === pacienteId).forEach(s => {
      obx('ST', '85354-9', 'Presion arterial', s.pa, 'mm[Hg]');
      obx('NM', '8867-4', 'Frecuencia cardiaca', s.fc, '/min');
      obx('NM', '9279-1', 'Frecuencia respiratoria', s.fr, '/min');
      obx('NM', '8310-5', 'Temperatura', s.temp, 'Cel');
      obx('NM', '2708-6', 'Saturacion O2', s.sato2, '%');
    });
    return seg.join('\n'); // el separador real HL7 es \r; aquí \n solo para leerlo en pantalla
  }

  // ---------- Incidencias (marco ITIL) ----------
  const NIV = { Bajo: 1, Medio: 2, Alto: 3 };
  const prioridad = (imp, urg) => {
    if (!NIV[imp] || !NIV[urg]) return '';
    const n = NIV[imp] + NIV[urg];
    return n >= 6 ? 'P1 - Crítica' : n === 5 ? 'P2 - Alta' : n === 4 ? 'P3 - Media' : 'P4 - Baja';
  };
  function incidencias() {
    if (!extra.inc_init) { extra.incidencias = INCIDENCIAS_BASE.map(x => ({ ...x })); extra.inc_init = true; guardar(); }
    return extra.incidencias;
  }
  function nuevaIncidencia(i) {
    const lista = incidencias();
    const n = Math.max(0, ...lista.map(x => parseInt(String(x.id).replace(/\D/g, ''), 10) || 0)) + 1;
    const reg = { id: 'INC-' + String(n).padStart(3, '0'), fecha: ahora().slice(0, 10), estado: 'Nueva', asignado: '', resolucion: '', cierre: '', ...i };
    lista.push(reg); guardar();
    return reg;
  }
  function cambiarEstadoInc(id, estado, resolucion) {
    const x = incidencias().find(y => y.id === id);
    if (!x) return null;
    x.estado = estado;
    if (resolucion) x.resolucion = resolucion;
    x.cierre = estado === 'Cerrada' || estado === 'Resuelta' ? ahora().slice(0, 10) : '';
    guardar();
    return x;
  }
  // Un acceso denegado genera una incidencia de seguridad (sin duplicar mientras siga abierta)
  function incidenciaSeguridad(usuario, rol, modulo) {
    const ya = incidencias().find(x => x.auto && x.usuarioAfectado === usuario && x.modulo === modulo && x.estado !== 'Cerrada' && x.estado !== 'Resuelta');
    if (ya) { ya.repeticiones = (ya.repeticiones || 1) + 1; guardar(); return ya; }
    return nuevaIncidencia({
      caso: '', modulo, categoria: 'Seguridad', reportado: 'sistema', auto: true, usuarioAfectado: usuario, repeticiones: 1,
      descripcion: `${usuario} (${rol}) intentó abrir «${modulo}» sin permiso`,
      esperado: 'Acceso denegado', obtenido: 'Acceso denegado y registrado en auditoría', impacto: 'Medio', urgencia: 'Medio',
    });
  }

  return {
    sha256, datos, restablecer, MATRIZ, permitido, auditar, login, logout,
    get sesion() { return sesion; }, nuevoPaciente, nuevoSigno, nuevaAtencion, nuevoDiagnostico, fhirBundle, hl7,
    incidencias, nuevaIncidencia, cambiarEstadoInc, incidenciaSeguridad, prioridad,
  };
})();
if (typeof module !== 'undefined') module.exports = HIS;

</script>
<script>
let DATOS = DATOS_BASE; // datos incrustados: sirven de respaldo si no se pueden leer los JSON
function completarDatos() { // suma los roles/usuarios nuevos a lo que venga de los JSON o de los datos incrustados
  EXTRA_ROLES.forEach(r => { if (!DATOS.roles.includes(r)) DATOS.roles.push(r); });
  EXTRA_USUARIOS.forEach(u => { if (!DATOS.usuarios.some(x => x.usuario === u.usuario)) DATOS.usuarios.push({ ...u }); });
}
completarDatos();
const $ = s => document.querySelector(s);

/* ---------- Datos desde JSON (tableconvert*.json) ---------- */
const RUTA_JSON = ''; // carpeta de los JSON; vacío = misma carpeta que este HTML (ej. 'data/')
const TABLAS_JSON = ['pacientes', 'atenciones', 'citas', 'diagnosticos', 'profesionales', 'roles', 'signosvitales', 'usuarios', 'auditoria'];
const dvJ = n => { let a = 0, m = 2; for (const d of String(n).split('').reverse()) { a += +d * m; m = m === 7 ? 2 : m + 1; } const r = 11 - (a % 11); return r === 11 ? '0' : r === 10 ? 'K' : String(r); };
const rutJ = (base, i) => `${base + i}-${dvJ(base + i)}`; // RUT FICTICIOS (rangos 98/99 millones)
let fuenteDatos = 'incrustados';
async function cargarDatos() {
  try {
    if (location.protocol === 'file:') throw new Error('Los navegadores no dejan leer archivos al abrir con doble clic');
    const t = {};
    await Promise.all(TABLAS_JSON.map(async nombre => {
      const r = await fetch(`${RUTA_JSON}tableconvert${nombre}.json`, { cache: 'no-store' });
      if (!r.ok) throw new Error(`No se encontró tableconvert${nombre}.json`);
      t[nombre] = await r.json();
    }));
    const n = v => Number(v), f = v => String(v ?? '').slice(0, 10);
    DATOS = {
      roles: t.roles.map(x => x.Rol),
      usuarios: t.usuarios.map(x => ({ usuario: x.Usuario, hash: HIS.sha256(x.Usuario + ':' + x['Contraseña']), nombre: x.Nombre, rol: x.Rol })),
      pacientes: t.pacientes.map((x, i) => ({ id: i + 1, rut: rutJ(99000000, i + 1), nombres: x.fname, apellidos: x.lname, fecha_nacimiento: f(x.DOB), sexo: x.sex, telefono: String(x.phone_home ?? ''), email: x.email, ciudad: x.city })),
      profesionales: t.profesionales.map(x => ({ id: n(x.ID), rut: rutJ(98000000, n(x.ID)), nombre: x.Nombre, profesion: x.Profesion, especialidad: x.Especialidad })),
      citas: t.citas.map(x => ({ id: n(x.ID), paciente_id: n(x.PacienteID), fecha: f(x.Fecha), hora: String(x.Hora).slice(0, 5), profesional_id: n(x.ProfesionalID), estado: x.Estado })),
      atenciones: t.atenciones.map(x => ({ id: n(x.ID), paciente_id: n(x.PacienteID), fecha: f(x.Fecha), profesional_id: n(x.ProfesionalID), motivo: x.MotivoConsulta })),
      diagnosticos: t.diagnosticos.map(x => ({ id: n(x.ID), atencion_id: n(x.AtencionID), cie10: x.CIE10, descripcion: x.Diagnostico })),
      signos_vitales: t.signosvitales.map(x => ({ id: n(x.ID), paciente_id: n(x.PacienteID), fecha: f(x.Fecha), pa: x.PA, fc: n(x.FC), fr: n(x.FR), temp: n(x.Temp), sato2: n(x.SatO2) })),
      auditoria: t.auditoria.map(x => ({ fecha_hora: x.FechaHora, usuario: x.Usuario, accion: x.Accion, modulo: x.Modulo })),
    };
    fuenteDatos = 'JSON';
  } catch (e) {
    DATOS = DATOS_BASE; fuenteDatos = 'incrustados';
    console.info('Usando datos incrustados:', e.message);
  }
  completarDatos();
  const el = $('#fuente');
  if (el) el.textContent = fuenteDatos === 'JSON' ? 'Datos: leídos de los JSON' : 'Datos: incrustados (abre con un servidor para leer los JSON)';
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nombrePac = p => `${p.nombres} ${p.apellidos}`;
const MENU = [
  { id: 'inicio', t: 'Inicio', mod: null }, { id: 'pacientes', t: 'Pacientes', mod: 'pacientes' },
  { id: 'agenda', t: 'Agenda', mod: 'agenda' }, { id: 'atenciones', t: 'Atenciones', mod: 'atenciones' },
  { id: 'fhir', t: 'FHIR', mod: 'fhir' }, { id: 'hl7', t: 'HL7', mod: 'hl7' },
  { id: 'auditoria', t: 'Auditoría', mod: 'auditoria' }, { id: 'incidencias', t: 'Incidencias', mod: 'incidencias' }, { id: 'roles', t: 'Roles y permisos', mod: 'usuarios' },
];
const MOD_DE = { inicio: null, pacientes: 'pacientes', ficha: 'pacientes', agenda: 'agenda', atenciones: 'atenciones', fhir: 'fhir', hl7: 'hl7', auditoria: 'auditoria', incidencias: 'incidencias', roles: 'usuarios' };
const NOMBRE_MOD = { usuarios: 'Usuarios y roles', auditoria: 'Auditoría', pacientes: 'Pacientes', agenda: 'Agenda', atenciones: 'Atenciones', diagnosticos: 'Diagnósticos', signos_vitales: 'Signos vitales', fhir: 'FHIR', hl7: 'HL7', incidencias: 'Incidencias' };

function descargar(nombre, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo })); a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); }
  catch (e) { const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
}

/* ---------- Ayudas visuales ---------- */
const COLS = ['var(--ac)', 'var(--vio)', 'var(--rosa)', 'var(--ambar)', 'var(--verde)', 'var(--azul)', 'var(--naranja)', 'var(--lima)'];
const COL_NAV = { inicio: 'var(--ac)', pacientes: 'var(--verde)', agenda: 'var(--ambar)', atenciones: 'var(--rosa)', fhir: 'var(--vio)', hl7: 'var(--azul)', auditoria: 'var(--naranja)', incidencias: 'var(--rojo)', roles: 'var(--lima)' };
const hue = s => [...String(s)].reduce((a, c) => a * 31 + c.charCodeAt(0) >>> 0, 7) % 360;
const av = (p, c = '') => `<span class="av ${c}" style="--h:${(p.id * 47) % 360}">${esc((p.nombres[0] || '') + (p.apellidos[0] || ''))}</span>`;
function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); }
const cuenta = (arr, f) => { const o = {}; arr.forEach(x => { const k = f(x); o[k] = (o[k] || 0) + 1; }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
const barras = items => { const m = Math.max(1, ...items.map(i => i[1])); return items.map(([t, n], i) => `<div class="barra"><span title="${esc(t)}">${esc(t)}</span><div><i data-w="${n / m * 100}" style="background:${COLS[i % 8]};box-shadow:0 0 12px ${COLS[i % 8]}"></i></div><b>${n}</b></div>`).join(''); };
const dona = (items, centro) => {
  const tot = items.reduce((a, i) => a + i[1], 0) || 1; let ac = 0;
  const g = items.map(([, n, c]) => { const a = ac / tot * 360; ac += n; return `${c} ${a}deg ${ac / tot * 360}deg`; }).join(',');
  return `<div class="donawrap"><div class="dona" style="background:conic-gradient(${g})"><span>${centro}</span></div><div class="leyenda">${items.map(([t, n, c]) => `<div><i style="background:${c}"></i>${esc(t)} <b>${n}</b></div>`).join('')}</div></div>`;
};
const vit = (k, v) => {
  if (k === 'fc') return v < 50 || v > 120 ? 'bad' : v < 60 || v > 100 ? 'warn' : 'ok';
  if (k === 'fr') return v < 10 || v > 28 ? 'bad' : v < 12 || v > 20 ? 'warn' : 'ok';
  if (k === 'temp') return v >= 39 || v < 35 ? 'bad' : v >= 37.5 || v < 36 ? 'warn' : 'ok';
  if (k === 'sato2') return v < 90 ? 'bad' : v < 95 ? 'warn' : 'ok';
  if (k === 'pa') { const [a, b] = String(v).split('/').map(Number); return a >= 180 || b >= 110 || a < 90 ? 'bad' : a >= 140 || b >= 90 ? 'warn' : 'ok'; }
  return 'ok';
};
const vtd = (k, v) => `<td><span class="v v-${vit(k, v)}">${esc(v)}</span></td>`;
const alertasDe = x => ['pa', 'fc', 'fr', 'temp', 'sato2'].filter(k => vit(k, x[k]) !== 'ok');
function spark(sv) {
  if (sv.length < 2) return '';
  const W = 300, H = 64;
  const linea = (k, mn, mx, c) => `<polyline pathLength="1" style="color:${c};stroke:${c}" points="${sv.map((x, i) => `${(4 + i / (sv.length - 1) * (W - 8)).toFixed(1)},${(H - 6 - Math.max(0, Math.min(1, (x[k] - mn) / (mx - mn))) * (H - 12)).toFixed(1)}`).join(' ')}"/>`;
  return `<div class="spark"><div><div class="mut">Frecuencia cardiaca</div><svg viewBox="0 0 ${W} ${H}">${linea('fc', 40, 140, 'var(--rosa)')}</svg></div><div><div class="mut">Saturación O₂</div><svg viewBox="0 0 ${W} ${H}">${linea('sato2', 85, 100, 'var(--verde)')}</svg></div></div>`;
}
function animar() {
  document.querySelectorAll('[data-n]').forEach(el => {
    const n = +el.dataset.n, t0 = performance.now();
    const f = t => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
  document.querySelectorAll('[data-w]').forEach(el => requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = el.dataset.w + '%'; })));
}

/* ---------- Registro de diagnósticos (CIE-10) ---------- */
const CIE_COMUNES = [['I10', 'Hipertensión esencial'], ['E11', 'Diabetes Mellitus Tipo 2'], ['J06', 'Infección respiratoria aguda'], ['K29', 'Gastritis'],
  ['J45', 'Asma'], ['E78', 'Trastornos del metabolismo de las lipoproteínas y otras lipidemias'], ['N39.0', 'Infección de vías urinarias, sitio no especificado'],
  ['M54', 'Dorsalgia'], ['R51', 'Cefalea'], ['K21', 'Enfermedad del reflujo gastroesofágico'], ['F41', 'Otros trastornos de ansiedad'],
  ['J02', 'Faringitis aguda'], ['E66', 'Obesidad'], ['I20', 'Angina de pecho']];
const catalogoCie = () => { const m = new Map(CIE_COMUNES); HIS.datos().diagnosticos.forEach(x => m.set(x.cie10, x.descripcion)); return m; };
function formDx(at) {
  return `<form id="formDx" class="fila" style="margin-top:1rem">
    <div><label for="dxAt">Atención</label><select name="atencion" id="dxAt">${at.map(a => `<option value="${a.id}">${esc(a.fecha)} · ${esc(a.motivo)}</option>`).join('')}<option value="0">+ Nueva atención de hoy</option></select></div>
    <div id="dxMotivo" ${at.length ? 'hidden' : ''}><label for="dxMot">Motivo de consulta</label><input name="motivo" id="dxMot"></div>
    <div><label for="dxCod">Código CIE-10</label><input name="cie10" id="dxCod" list="listaCie" required size="8" maxlength="8" pattern="[A-Za-z][0-9]{2}(\\.[0-9A-Za-z]{1,4})?" autocomplete="off"></div>
    <div><label for="dxDes">Diagnóstico</label><input name="descripcion" id="dxDes" required style="min-width:260px"></div>
    <datalist id="listaCie">${[...catalogoCie()].map(([c, t]) => `<option value="${esc(c)}">${esc(t)}</option>`).join('')}</datalist>
    <button class="pri">Registrar diagnóstico</button></form>`;
}

/* ---------- Vistas ---------- */
const VISTAS = {
  inicio() {
    const s = HIS.sesion, perm = HIS.MATRIZ[s.rol] || {}, d = HIS.datos(), ok = m => HIS.permitido(s.rol, m);
    const kp = [];
    if (ok('pacientes')) kp.push(['🧑‍🤝‍🧑', 'Pacientes', d.pacientes.length, 'var(--ac)']);

    if (ok('atenciones')) kp.push(['🩺', 'Atenciones', d.atenciones.length, 'var(--rosa)']);
    if (ok('diagnosticos')) kp.push(['🧬', 'Diagnósticos', d.diagnosticos.length, 'var(--vio)']);

    if (ok('auditoria')) kp.push(['🛡️', 'Eventos de auditoría', d.auditoria.length, 'var(--naranja)']);
    if (ok('incidencias')) kp.push(['🚨', 'Incidencias abiertas', HIS.incidencias().filter(x => x.estado !== 'Cerrada' && x.estado !== 'Resuelta').length, 'var(--rojo)']);
    const graf = [];
    if (ok('incidencias')) graf.push(`<div class="card graf"><h3>Incidencias por prioridad</h3>${barras(cuenta(HIS.incidencias(), x => HIS.prioridad(x.impacto, x.urgencia)).sort((a, b) => a[0].localeCompare(b[0])))}</div>`);
    if (ok('pacientes')) {
      graf.push(`<div class="card graf"><h3>Pacientes por ciudad</h3>${barras(cuenta(d.pacientes, p => p.ciudad).slice(0, 8))}</div>`);
      graf.push(`<div class="card graf"><h3>Pacientes por sexo</h3>${dona(cuenta(d.pacientes, p => p.sexo).map(([k, n]) => [k === 'F' ? 'Mujeres' : 'Hombres', n, k === 'F' ? 'var(--rosa)' : 'var(--azul)']), d.pacientes.length)}</div>`);
    }
    if (ok('agenda')) {
      const ec = { Agendada: 'var(--azul)', Atendida: 'var(--verde)', Cancelada: 'var(--rojo)' };
      graf.push(`<div class="card graf"><h3>Citas por estado</h3>${dona(cuenta(d.citas, c => c.estado).map(([k, n]) => [k, n, ec[k] || 'var(--vio)']), d.citas.length)}</div>`);
    }
    if (ok('diagnosticos')) graf.push(`<div class="card graf"><h3>Diagnósticos más frecuentes</h3>${barras(cuenta(d.diagnosticos, x => `${x.cie10} ${x.descripcion}`).slice(0, 6))}</div>`);
    if (ok('signos_vitales') && ok('pacientes')) {
      const al = d.signos_vitales.filter(x => alertasDe(x).length).slice(-5).reverse();
      graf.push(`<div class="card graf"><h3>Alertas de signos vitales</h3>${al.map(x => { const p = d.pacientes.find(y => y.id === x.paciente_id); return p ? `<a class="alerta" href="#ficha/${p.id}"><span>${esc(nombrePac(p))}</span><span>${alertasDe(x).map(k => k.toUpperCase()).join(' · ')}</span></a>` : ''; }).join('') || '<p class="mut">Sin alertas: todos los registros están en rango.</p>'}</div>`);
    }
    $('#vista').innerHTML = `<h1>Hola, ${esc(s.nombre)}</h1>

        ${lista.map(x => { const pr = HIS.prioridad(x.impacto, x.urgencia); return `<tr>
          <td><b>${esc(x.id)}</b>${x.caso ? `<small>${esc(x.caso)}</small>` : ''}</td><td>${esc(x.fecha)}</td><td>${esc(x.modulo)}</td><td>${esc(x.categoria)}</td>
          <td class="desc">${x.auto ? '<span class="auto">AUTOMÁTICA</span> ' : ''}${esc(x.descripcion)}${x.repeticiones > 1 ? ` <span class="mut">(×${x.repeticiones})</span>` : ''}
            <small>Esperado: ${esc(x.esperado)} · Obtenido: ${esc(x.obtenido)}</small>${x.resolucion ? `<small>✔ ${esc(x.resolucion)}${x.cierre ? ' · ' + esc(x.cierre) : ''}</small>` : ''}</td>
          <td><span class="pr p-${esc(pr.slice(0, 2))}">${esc(pr)}</span></td>
          <td>${puede ? `<select data-id="${esc(x.id)}">${opt(ESTADOS, x.estado)}</select>` : `<span class="badge e-${cls(x.estado)}">${esc(x.estado)}</span>`}</td>
          <td>${esc(x.reportado)}</td><td>${esc(x.asignado || '—')}</td></tr>`; }).join('') || '<tr><td colspan="9" class="mut">Sin incidencias con ese filtro</td></tr>'}</table>`;
      animar();
    };
    $('#fe').onchange = e => { fe = e.target.value; pintar(); };
    $('#fp').onchange = e => { fp = e.target.value; pintar(); };
    $('#csvInc').onclick = () => {
      const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const cab = ['ID', 'Fecha', 'Caso UAT', 'Módulo', 'Categoría', 'Reportado por', 'Descripción', 'Esperado', 'Obtenido', 'Impacto', 'Urgencia', 'Prioridad', 'Estado', 'Asignado', 'Resolución', 'Cierre'];
      const filas = HIS.incidencias().map(x => [x.id, x.fecha, x.caso, x.modulo, x.categoria, x.reportado, x.descripcion, x.esperado, x.obtenido, x.impacto, x.urgencia, HIS.prioridad(x.impacto, x.urgencia), x.estado, x.asignado, x.resolucion, x.cierre]);
      descargar('incidencias_uat.csv', '\ufeff' + [cab, ...filas].map(f => f.map(q).join(';')).join('\n'), 'text/csv;charset=utf-8');
    };
    $('#tablaInc').addEventListener('change', e => {
      const sel = e.target.closest('select[data-id]'); if (!sel || !puede) return;
      const res = sel.value === 'Resuelta' ? (prompt('Acción o resolución aplicada (opcional):') || '') : '';
      HIS.cambiarEstadoInc(sel.dataset.id, sel.value, res);
      HIS.auditar(s.usuario, `Incidencia ${sel.dataset.id} → ${sel.value}`, 'Incidencias');
      toast(`${sel.dataset.id}: ${sel.value}`); pintar();
    });
    if (puede) {
      $('#btnInc').onclick = () => { $('#formInc').hidden = false; $('#formInc').querySelector('[name=descripcion]').focus(); };
      $('#cancelInc').onclick = () => { $('#formInc').hidden = true; };
      $('#formInc').addEventListener('submit', e => {
        e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
        const r = HIS.nuevaIncidencia({ ...v, reportado: s.usuario });
        HIS.auditar(s.usuario, `Incidencia creada ${r.id}`, 'Incidencias'); toast(`${r.id} registrada`); render();
      });
    }
    pintar();
  },

  roles() {
    const roles = DATOS.roles, mods = Object.keys(NOMBRE_MOD), mio = HIS.sesion.rol;
    $('#vista').innerHTML = `<h1>Roles y permisos</h1><p class="mut">Matriz de perfilado: qué puede hacer cada rol en cada módulo. Tu rol aparece resaltado.</p>
      <div class="card tabla"><table><tr><th>Módulo</th>${roles.map(r => `<th${r === mio ? ' style="color:var(--ac)"' : ''}>${esc(r)}</th>`).join('')}</tr>
      ${mods.map(m => `<tr><td><b>${esc(NOMBRE_MOD[m])}</b></td>${roles.map(r => { const n = (HIS.MATRIZ[r] || {})[m];
        return `<td${r === mio ? ' style="background:var(--ac2)"' : ''}>${n ? `<span class="badge b-${n}">${n}</span>` : '<span class="mut">—</span>'}</td>`; }).join('')}</tr>`).join('')}</table></div>
      <div class="nota"><b>ver</b>: solo consulta · <b>escribir</b>: consulta y registra. Los permisos de escritura están activos en Pacientes (alta), Signos vitales (registro) e Incidencias (registro y gestión).</div>`;
  },
};

function interop(tipo) {
  const d = HIS.datos(), s = HIS.sesion, esFhir = tipo === 'FHIR';
  $('#vista').innerHTML = `<h1>Interoperabilidad ${tipo}</h1><div class="card"><div class="fila">
    <div><label for="pac">Paciente</label><select id="pac">${d.pacientes.map(p => `<option value="${p.id}">${p.id} · ${esc(nombrePac(p))}</option>`).join('')}</select></div>
    ${esFhir ? '' : '<div><label for="tipo">Tipo de mensaje</label><select id="tipo"><option value="ADT_A04">ADT^A04 · Registro de paciente</option><option value="ADT_A08">ADT^A08 · Actualización de datos</option><option value="ORU_R01">ORU^R01 · Resultado (signos vitales)</option></select></div>'}
    <button class="pri" id="gen">Generar</button><button id="cop" disabled>Copiar</button><button id="des" disabled>Descargar</button></div>
    <pre id="salida" class="mut">Elige un paciente y presiona Generar.</pre></div>`;
  let texto = '';
  $('#gen').onclick = () => {
    const id = +$('#pac').value;
    texto = esFhir ? JSON.stringify(HIS.fhirBundle(id), null, 2) : HIS.hl7($('#tipo').value, id);
    $('#salida').textContent = texto; $('#salida').classList.remove('mut');
    $('#cop').disabled = $('#des').disabled = false; toast(`${tipo} generado`);
    HIS.auditar(s.usuario, `Generación ${tipo} paciente ${id}`, tipo);
  };
  $('#cop').onclick = async () => { await copiar(texto); $('#cop').textContent = '¡Copiado!'; setTimeout(() => ($('#cop').textContent = 'Copiar'), 1500); };
  $('#des').onclick = () => descargar(esFhir ? `paciente-${$('#pac').value}.fhir.json` : `paciente-${$('#pac').value}.hl7.txt`, texto, esFhir ? 'application/json' : 'text/plain');
}

/* ---------- Enrutador ---------- */
function render() {
  const s = HIS.sesion;
  if (!s) return mostrarLogin();
  $('#login').hidden = true; $('#app').hidden = false;
  $('#quien').innerHTML = `<strong>${esc(s.nombre)}</strong><span class="pill">${esc(s.rol)}</span>`;
  const [vista, arg] = (location.hash.slice(1) || 'inicio').split('/');
  if (!(vista in MOD_DE)) { location.hash = 'inicio'; return; }
  const activo = vista === 'ficha' ? 'pacientes' : vista;
  $('#menu').innerHTML = MENU.filter(m => !m.mod || HIS.permitido(s.rol, m.mod))
    .map(m => `<a href="#${m.id}" style="--c:${COL_NAV[m.id]}" class="${m.id === activo ? 'act' : ''}">${m.t}</a>`).join('');
  const mod = MOD_DE[vista];
  if (mod && !HIS.permitido(s.rol, mod)) {
    HIS.auditar(s.usuario, `Acceso denegado (${mod}:ver)`, NOMBRE_MOD[mod]);
    HIS.incidenciaSeguridad(s.usuario, s.rol, NOMBRE_MOD[mod]);
    $('#vista').innerHTML = `<h1>Acceso denegado</h1><div class="aviso">Tu rol (${esc(s.rol)}) no tiene permiso para el módulo «${esc(NOMBRE_MOD[mod])}». El intento quedó registrado en auditoría y como incidencia de seguridad.</div>`;
    return;
  }
  VISTAS[vista](arg);
  animar();
  window.scrollTo(0, 0);
}
const relojTick = () => { $('#reloj').textContent = new Date().toLocaleString('es-CL', { dateStyle: 'medium', timeStyle: 'medium' }); };
relojTick(); setInterval(relojTick, 1000);
window.addEventListener('hashchange', render);
cargarDatos().then(render);
</script>
</body>
</html>
